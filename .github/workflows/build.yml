name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate documentation and release version
        run: |
          python3 scripts/check-project.py
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            test -f "docs/releases/$version.md"
          fi
      - name: Build and test twice in the pinned container
        run: |
          bash build.sh
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          jar="build/libs/internal-furnace-$version.jar"
          first=$(sha256sum "$jar" | cut -d' ' -f1)
          bash build.sh
          second=$(sha256sum "$jar" | cut -d' ' -f1)
          test "$first" = "$second"
          printf '%s  internal-furnace-%s.jar\n' "$second" "$version" > build/libs/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-furnace
          path: |
            build/libs/internal-furnace-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: internal-furnace
          path: dist
      - name: Publish the tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          (cd dist && sha256sum --check SHA256SUMS)
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Internal Furnace $version" \
            --notes-file "docs/releases/$version.md" "${options[@]}" \
            "dist/internal-furnace-$version.jar" dist/SHA256SUMS
